<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101318">

<!-- ===========================================================================
     ТЕГИ ДЛЯ ПОИСКОВИКОВ И МЕССЕНДЖЕРОВ.
     Это единственное место вне content.js, где лежит текст.
     Причина: когда ссылку кидают в Telegram или WhatsApp, их роботы
     не запускают скрипты и читают только эти строки.
     Если правите тексты в content.js (раздел 10) — продублируйте их здесь.
     =========================================================================== -->
<title>Заказать музыкантов на праздник в Москве: дуэт баяна и гуслей — In stile russo</title>
<meta name="description" content="Дуэт народных инструментов «In stile russo»: баян и гусли на свадьбу, корпоратив, юбилей и городской праздник в Москве. Народная классика и современные хиты в народной обработке. Видео, форматы, стоимость.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="In stile russo">
<meta property="og:title" content="Дуэт баяна и гуслей на праздник в Москве — In stile russo">
<meta property="og:description" content="Народная классика и современные хиты в народной обработке. Свадьбы, корпоративы, городские праздники.">
<meta property="og:image" content="img/og.webp">
<meta property="og:image:alt" content="Дуэт «In stile russo»: баян и гусли">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="{{АДРЕС_САЙТА}}">

<link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">

<!-- Тексты. Подключены до разметки, чтобы страница сразу рисовалась с ними. -->
<script src="content.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "In stile russo",
  "alternateName": "Дуэт народных инструментов «In stile russo»",
  "genre": ["Русская народная музыка", "Фолк-кроссовер"],
  "description": "Дуэт баяна и гуслей: народная классика и современные хиты в народной обработке. Выступления на свадьбах, корпоративах, юбилеях и городских праздниках.",
  "url": "{{АДРЕС_САЙТА}}",
  "image": "{{АДРЕС_САЙТА}}/img/og.webp",
  "areaServed": { "@type": "City", "name": "Москва" },
  "location": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Москва", "addressCountry": "RU" } },
  "member": [
    { "@type": "Person", "name": "{{ИМЯ_МУЗЫКАНТА_БАЯН}}" },
    { "@type": "Person", "name": "{{ИМЯ_МУЗЫКАНТА_ГУСЛИ}}" }
  ],
  "telephone": "{{ТЕЛЕФОН_БЕЗ_ПРОБЕЛОВ}}",
  "email": "{{EMAIL}}",
  "sameAs": ["{{VK_URL}}", "{{TELEGRAM_КАНАЛ_URL}}", "{{YOUTUBE_КАНАЛ_URL}}"]
}
</script>
</head>

<body>

<a class="skip-link" href="#main" data-text="ui.skipLink"></a>

<header class="header" id="header">
  <div class="header__inner">
    <a class="brand" href="#top" data-text="brand.name" translate="no"></a>
    <nav class="nav" aria-label="" data-attr-aria-label="ui.navLabel">
      <ul class="nav__list" id="nav-list"></ul>
    </nav>
    <a class="btn btn--compact header__cta" href="#contacts" data-text="cta"></a>
  </div>
</header>

<main id="main">

  <!-- ПЕРВЫЙ ЭКРАН -->
  <section class="hero" id="top">
    <div class="hero__pattern" aria-hidden="true"></div>
    <div class="hero__inner">
      <div class="hero__text">
        <h1 class="hero__title" data-text="hero.title"></h1>
        <p class="hero__subtitle" data-text="hero.subtitle"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="#contacts" data-text="cta"></a>
          <a class="link-underline hero__video-link" href="#media" data-text="hero.secondaryLink"></a>
        </div>
      </div>
      <figure class="hero__figure">
        <img class="hero__photo" id="hero-photo" alt="" decoding="async" fetchpriority="high">
      </figure>
    </div>
  </section>

  <!-- ФОРМАТЫ -->
  <section class="section" id="formats">
    <div class="wrap">
      <h2 class="section__title" data-text="formats.title"></h2>
      <p class="section__intro" data-text="formats.intro"></p>
      <ul class="formats" id="formats-list"></ul>
      <p class="section__note" data-text="formats.note"></p>
    </div>
  </section>

  <!-- РЕПЕРТУАР -->
  <section class="section section--paper" id="repertoire">
    <div class="wrap">
      <h2 class="section__title" data-text="repertoire.title"></h2>
      <p class="section__intro" data-text="repertoire.intro"></p>
      <div class="repertoire" id="repertoire-list"></div>
      <p class="section__note" data-text="repertoire.note"></p>
    </div>
  </section>

  <!-- ВИДЕО, АУДИО, ФОТО -->
  <section class="section" id="media">
    <div class="wrap">
      <h2 class="section__title" data-text="media.title"></h2>
      <p class="section__intro" data-text="media.videoNote"></p>
      <div class="video video--main" id="video-main"></div>
      <div class="video-row" id="video-row"></div>

      <h3 class="subtitle" data-text="media.audio.title"></h3>
      <div class="audio" id="audio"></div>

      <h3 class="subtitle" data-text="media.photosTitle"></h3>
      <p class="visually-hidden" data-text="ui.photosScrollHint"></p>
      <ul class="photos" id="photos"></ul>
    </div>
  </section>

  <!-- ОТЗЫВЫ -->
  <section class="section section--paper" id="reviews">
    <div class="wrap">
      <h2 class="section__title" data-text="reviews.title"></h2>
      <div class="reviews" id="reviews-list"></div>
    </div>
  </section>

  <!-- О ДУЭТЕ -->
  <section class="section" id="about">
    <div class="wrap about">
      <div class="about__text">
        <h2 class="section__title" data-text="about.title"></h2>
        <p class="about__lead" data-text="about.lead"></p>
        <p data-text="about.sound"></p>
        <dl class="credentials" id="credentials"></dl>
      </div>
      <figure class="about__figure">
        <img class="about__photo" id="about-photo" alt="" loading="lazy" decoding="async">
      </figure>
    </div>
  </section>

  <!-- КОНТАКТЫ -->
  <section class="section section--ink" id="contacts">
    <div class="wrap">
      <h2 class="section__title" data-text="contacts.title"></h2>
      <p class="section__intro" data-text="contacts.lead"></p>

      <div class="contacts__buttons" id="contact-buttons"></div>

      <div class="form-block">
        <h3 class="subtitle" data-text="contacts.form.title"></h3>
        <form class="form" id="lead-form" novalidate>
          <p class="form__row">
            <label class="form__label" for="f-name" data-text="contacts.form.fields.name.label"></label>
            <input class="form__input" id="f-name" name="name" type="text" autocomplete="name" required>
          </p>
          <p class="form__row">
            <label class="form__label" for="f-date" data-text="contacts.form.fields.date.label"></label>
            <input class="form__input" id="f-date" name="date" type="date" required>
            <span class="form__hint" data-text="contacts.form.fields.date.hint"></span>
          </p>
          <p class="form__row">
            <label class="form__label" for="f-type" data-text="contacts.form.fields.type.label"></label>
            <select class="form__input" id="f-type" name="event_type"></select>
          </p>
          <p class="form__row">
            <label class="form__label" for="f-contact" data-text="contacts.form.fields.contact.label"></label>
            <input class="form__input" id="f-contact" name="contact" type="text" autocomplete="tel" inputmode="tel" spellcheck="false" required>
          </p>
          <button class="btn btn--primary form__submit" type="submit" id="form-submit" data-text="contacts.form.submit"></button>
          <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="social">
        <h3 class="subtitle" data-text="contacts.socialTitle"></h3>
        <ul class="social__list" id="social-list"></ul>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__brand" data-text="brand.name" translate="no"></p>
    <p data-text="footer.city"></p>
    <p class="footer__copy" id="footer-copy"></p>
  </div>
</footer>

<div class="sticky" id="sticky" hidden>
  <nav class="sticky__inner" aria-label="" data-attr-aria-label="ui.stickyLabel" id="sticky-inner"></nav>
</div>

<script src="script.js"></script>
